name: Build and Release Android TV APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/pixelstreamer-release.jks
          else
            keytool -genkeypair -v \
              -keystore app/pixelstreamer-release.jks \
              -alias pixelstreamer \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass pixelstreamer_tv -keypass pixelstreamer_tv \
              -dname "CN=Pixel Streamer, OU=TV, O=PixelStreamer, L=Internet, S=NA, C=US"
          fi

      - name: Run unit tests and build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Package and verify signed APK
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          APK_NAME="PixelStreamer-tv-${TAG}.apk"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify "release-assets/${APK_NAME}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=release-assets/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelStreamer-APK-${{ steps.pkg.outputs.tag }}
          path: ${{ steps.pkg.outputs.apk_path }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          APK="${{ steps.pkg.outputs.apk_path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Pixel Streamer ${TAG}" \
              --generate-notes
          fi
