name: Build and Release TV and Tablet APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Android SDK 35 and accept licenses
        run: |
          SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          fi

      - name: Configure release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/pixelstreamer-release.jks
          else
            keytool -genkeypair -v \
              -keystore app/pixelstreamer-release.jks \
              -alias pixelstreamer \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass pixelstreamer_tv -keypass pixelstreamer_tv \
              -dname "CN=Pixel Streamer, OU=TV, O=PixelStreamer, L=Internet, S=NA, C=US"
          fi

      - name: Run unit tests and build TV + Tablet release APKs
        run: |
          chmod +x gradlew
          ./gradlew testTvDebugUnitTest testTabletDebugUnitTest assembleTvRelease assembleTabletRelease --no-daemon

      - name: Package and verify signed APKs
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          TV_APK="release-assets/PixelStreamer-tv-${TAG}.apk"
          TAB_APK="release-assets/PixelStreamer-tablet-${TAG}.apk"
          mkdir -p release-assets
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "$TV_APK"
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk "$TAB_APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify "$TV_APK"
            "$APKSIGNER" verify "$TAB_APK"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tv_apk=${TV_APK}" >> "$GITHUB_OUTPUT"
          echo "tablet_apk=${TAB_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelStreamer-APKs-${{ steps.pkg.outputs.tag }}
          path: release-assets/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          TV_APK="${{ steps.pkg.outputs.tv_apk }}"
          TAB_APK="${{ steps.pkg.outputs.tablet_apk }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TV_APK" "$TAB_APK" --clobber
          else
            gh release create "$TAG" "$TV_APK" "$TAB_APK" \
              --title "Pixel Streamer ${TAG}" \
              --generate-notes
          fi
